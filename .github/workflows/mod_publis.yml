name: Mod Publish

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  MODRINTH_ID: 'WaggvUE7'
  CURSEFORGE_ID: '573934'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.gradle-env.outputs.mod_version }}
      release_name: ${{ steps.gradle-env.outputs.release_name }}
      game_versions: ${{ steps.gradle-env.outputs.game_versions }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Read Gradle Metadata
        id: gradle-env
        shell: bash
        run: |
          MOD_VERSION="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          ARCHIVES_NAME="$(awk -F= '$1 == "archives_name" { print $2 }' gradle.properties)"
          GAME_VERSIONS="$(awk -F= '$1 == \"minecraft_versions\" { print $2 }' gradle.properties)"
          RELEASE_NAME="${ARCHIVES_NAME} ${MOD_VERSION}"

          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "game_versions=${GAME_VERSIONS}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/simplemango-fabric-${{ steps.gradle-env.outputs.mod_version }}.jar
          if-no-files-found: error

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: forge/build/libs/simplemango-forge-${{ steps.gradle-env.outputs.mod_version }}.jar
          if-no-files-found: error

  publish-fabric:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Fabric JAR
        uses: actions/download-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/

      - name: Fabric Publish (Modrinth & CurseForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/simplemango-fabric-${{ needs.build.outputs.mod_version }}.jar
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: release
          game-versions: ${{ needs.build.outputs.game_versions }}
          loaders: fabric
          dependencies: |
            fabric-api
            anvians-lib
          java: ${{ env.JAVA_VERSION }}

  publish-forge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Forge JAR
        uses: actions/download-artifact@v4
        with:
          name: forge-jar
          path: forge/build/libs/

      - name: Forge Publish (Modrinth & CurseForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: forge/build/libs/simplemango-forge-${{ needs.build.outputs.mod_version }}.jar
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: release
          game-versions: ${{ needs.build.outputs.game_versions }}
          loaders: forge
          dependencies: anvians-lib
          java: ${{ env.JAVA_VERSION }}

  publish-maven:
    needs: [publish-fabric, publish-forge]
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Publish to Reposilite
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish --no-daemon
