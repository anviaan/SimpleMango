plugins {
    id 'java-library'
    id 'maven-publish'
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

base {
    archivesName = "${rootProject.archives_name}-common-${rootProject.minecraft_version}"
}

dependencies {
    implementation "net.anvian.anvianslib:anvianslib-common-1.19:${rootProject.anvianslib_version}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "Reposilite"
            url = uri(version.toString().endsWith("SNAPSHOT") ?
                    "https://maven.anvian.net/snapshots" :
                    "https://maven.anvian.net/releases")
            credentials {
                username = (project.findProperty("reposilite.user") as String) ?: System.getenv("REPOSILITE_USER")
                password = (project.findProperty("reposilite.token") as String) ?: System.getenv("REPOSILITE_TOKEN")
            }
        }
    }
}
